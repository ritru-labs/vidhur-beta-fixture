# PROPOSAL ONLY: intended for the fixture repository, not the Vidhur repository.
# Requires explicit owner approval before installation or execution.
name: Protected Go fixture
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  protected-go:
    if: github.event.pull_request.head.repo.full_name == 'ritru-labs/vidhur-beta-fixture' && startsWith(github.event.pull_request.head.ref, 'vidhur/')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GOTOOLCHAIN: local
      GOPROXY: 'off'
      GOSUMDB: 'off'
      GOFLAGS: '-mod=readonly'
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 verified 2026-10-11
        with:
          repository: ritru-labs/vidhur-beta-fixture
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Install pinned Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6 verified 2026-10-11
        with:
          go-version: '1.26.8'
          cache: false
          check-latest: false
      - name: Check source identity and protected tests
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_HEAD" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          go version
          test -z "$(gofmt -l ids.go ids_test.go)"
          go vet ./...
          go test -race -count=1 ./...
          git diff --exit-code
